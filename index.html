<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="stylemq.css" />

    <title>Frontend Mentor | Results summary component</title>
  </head>
  <body>
    <section class="hero-section">

      <div class="hero-header-section">
        <div class="hero-header">
          <h2>Your Result</h2>
          <div class="result">
            <span>76</span>
            <p>of 100</p>
          </div>
        </div>
        <div class="hero-footer">
          <h2>Great</h2>
          <p>
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </div>
      </div>

      <div class="summary-section">
        <div class="summary-header">
          <h2>Summary</h2>
        </div>

        <div class="summary-content">
          <!-- First Row -->
          <div class="reaction">
            <div class="reaction-menu">
              <img
                src="/assets/images/icon-reaction.svg"
                alt="icon-reaction.svg"
              />
              <span>Reaction</span>
            </div>
            <div class="reaction-pctg">
              <p><strong>80</strong> / 100</p>
            </div>
          </div>

          <!-- Second Row -->
          <div class="memory">
            <div class="memory-menu">
              <img src="/assets/images/icon-memory.svg" alt="icon-memory.svg" />
              <span>Memory</span>
            </div>
            <div class="memory-pctg">
              <p><strong>92</strong> / 100</p>
            </div>
          </div>

          <!-- Third Row -->
          <div class="verbal">
            <div class="verbal-menu">
              <img src="/assets/images/icon-verbal.svg" alt="icon-verbal.svg" />
              <span>Verbal</span>
            </div>
            <div class="verbal-pctg">
              <p><strong>61</strong> / 100</p>
            </div>
          </div>

          <!-- Fourth Row -->
          <div class="visual">
            <div class="visual-menu">
              <img src="/assets/images/icon-visual.svg" alt="icon-visual.svg" />
              <span>Visual</span>
            </div>
            <div class="visual-pctg">
              <p><strong>73</strong> / 100</p>
            </div>
          </div>
        </div>

        <!-- Button -->
        <div class="btn">
          <a href="#">Continue</a>
        </div>
      </div>
    </section>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#"></a>.
    </footer>
  </body>
</html>
